<style>
:root{
  --bg:#f2f4f3;--card:#fff;--ink:#16211e;--muted:#6a7873;--line:#e2e8e5;

  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}

#banner{display:none;background:var(--warn-l);color:var(--warn);font-size:13px;padding:8px 16px;border-bottom:1px solid #f1dcb4}

.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff}

.stat{background:var(--card);border-radius:var(--r);padding:12px}

.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.qa button{background:var(--card);border:0;border-radius:var(--r);padding:10px 2px;font-size:11px;font-weight:600;

.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.ic.in{background:var(--in-l);color:var(--in)} .ic.out{background:var(--out-l);color:var(--out)}
.ic.pri{background:var(--pri-l);color:var(--pri)} .ic.warn{background:var(--warn-l);color:var(--warn)}

.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;

.row:last-child{border-bottom:0}

.row .a{font-weight:800;text-align:left}

.pos{color:var(--in)} .neg{color:var(--out)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--pri-l);color:var(--pri);font-weight:700}
.tag.warn{background:var(--warn-l);color:var(--warn)} .tag.ok{background:var(--in-l);color:var(--in)}

body.sheet-open #ov{opacity:1;pointer-events:auto}

#shBody{overflow:auto;padding:14px;flex:1;-webkit-overflow-scrolling:touch}
#shFoot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
#shFoot[hidden]{display:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--pri);color:#fff;flex:1}
.btn.ghost{background:#eef2f0;color:var(--ink)} .btn.danger{background:var(--out-l);color:var(--out);flex:0 0 auto}
.btn:disabled{opacity:.5}
.btn.sm{padding:9px 12px;font-size:13px;flex:0 0 auto}

.form label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:#fff;

.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}

html,body{overflow-x:hidden}

.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.err{color:var(--out);font-size:13px;font-weight:700;min-height:18px}

.ded{display:grid;grid-template-columns:1fr 100px 36px;gap:6px;margin-bottom:6px}

.chk{display:flex!important;align-items:center;gap:10px;padding:10px 4px;margin:0!important;border-bottom:1px solid var(--line);color:var(--ink)!important;font-size:15px!important}

.dedi input{margin:0!important}
.ln{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:#fafbfb}
.lnh{display:grid;grid-template-columns:1fr 96px;gap:6px;margin-bottom:6px}

.lnr{display:grid;grid-template-columns:72px 12px 1fr auto 34px;gap:6px;align-items:center}

.adj{display:grid;grid-template-columns:1fr 70px 70px 80px;gap:6px;align-items:center;margin:6px 0;font-size:13.5px}
.adj input{margin:0!important;padding:8px!important;font-size:15px!important}
.seg.mini{margin:0;padding:2px}.seg.mini button{padding:6px 2px;font-size:13px}
.adj .aa{text-align:left;font-size:14px}
.ded .x{border:0;background:var(--out-l);color:var(--out);border-radius:10px}
.addln{border:1px dashed var(--pri);background:var(--pri-l);color:var(--pri);border-radius:10px;width:100%;padding:8px;font-weight:700}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:800;font-size:16px}
.inl{display:flex;gap:8px;align-items:flex-end}
.inl label{flex:1}
.inl .btn{margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.acts .btn{flex:1 1 30%;font-size:13px;padding:10px 8px}
table.led{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden}
.led th{background:#eef2f0;font-weight:700;padding:8px 6px;text-align:right}
.led td:first-child{white-space:nowrap}
.led td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.led td.n{text-align:left;white-space:nowrap}
.led tr.click{cursor:pointer}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-20px);
  background:#16211e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:.2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(10,20,17,.5);display:none;place-items:center;padding:24px}
#dlg.show{display:grid}
#dlg .d{background:#fff;border-radius:16px;padding:18px;max-width:340px;width:100%}
#dlg p{margin:0 0 16px;font-weight:600;line-height:1.7}
#dlg .r{display:flex;gap:8px}
#sug{position:fixed;z-index:60;display:none;background:#fff;border:1px solid #d9dfdc;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);overflow:auto;padding:4px}
#sug button{display:block;width:100%;text-align:right;border:0;background:none;padding:10px 12px;border-radius:8px;font-weight:600;font-size:15px}
#sug button:active{background:#eef2f0}

<script>

const SB_URL='https://yoipkhlwehrrsuhvlqas.supabase.co';
const SB_KEY='sb_publishable_CaaAPDsC97jQyQsvdi8y_Q_6amV9Wpn';

window.__STANDALONE=true;
(()=>{
  const gate=document.getElementById('sbGate'),box=document.getElementById('sbBox'),pill=document.getElementById('syncPill');
  const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
  const cfg={u:(SB_URL||LS.get('sb_url')||'').trim(),k:(SB_KEY||LS.get('sb_key')||'').trim()};
  let client=null,session=null,userEmail=null,readyResolve,ready=new Promise(r=>readyResolve=r),isReady=false,manualOut=false;

  /* ---------- التطبيق (service worker + تثبيت) ---------- */
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let deferred=null;const ib=document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(isReady)ib.style.display='block'});
  ib.onclick=async()=>{if(!deferred)return;ib.style.display='none';deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null};
  window.addEventListener('appinstalled',()=>{ib.style.display='none'});

  /* ---------- قاعدة بيانات على الموبايل (IndexedDB) ---------- */
  const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('company-accounts',1);
      r.onupgradeneeded=()=>{const d=r.result;['docs','outbox','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
    const run=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let out;
      const r=fn(s);if(r&&'onsuccess' in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
    return{
      get:(s,k)=>run(s,'readonly',st=>st.get(k)),
      put:(s,k,v)=>run(s,'readwrite',st=>st.put(v,k)),
      del:(s,k)=>run(s,'readwrite',st=>st.delete(k)),
      clear:s=>run(s,'readwrite',st=>st.clear()),
      count:s=>run(s,'readonly',st=>st.count()),
      async all(s){const d=await open();return new Promise((res,rej)=>{const out=[];const c=d.transaction(s,'readonly').objectStore(s).openCursor();
        c.onsuccess=()=>{const cur=c.result;if(cur){out.push({key:cur.key,value:cur.value});cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
      async many(s,puts,dels){const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,'readwrite'),st=t.objectStore(s);
        (puts||[]).forEach(([k,v])=>st.put(v,k));(dels||[]).forEach(k=>st.delete(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
    }})();
  const K=(c,i)=>c+'|'+i;

  /* ---------- الذاكرة + المستمعين ---------- */
  const T='docs',cache={},listeners={};
  const genId=()=>{const a='abcdefghijklmnopqrstuvwxyz0123456789';let s='';crypto.getRandomValues(new Uint8Array(20)).forEach(b=>s+=a[b%36]);return s};
  const mp=c=>cache[c]||(cache[c]=new Map());
  function emit(col){if(!listeners[col])return;const m=mp(col);
    const docs=[...m.entries()].map(([id,data])=>({id,exists:true,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}}));
    const snap={docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};
    listeners[col].forEach(l=>{try{l(snap)}catch(e){console.error(e)}})}
  let localLoaded=null;
  const loadLocal=()=>localLoaded||(localLoaded=IDB.all('docs').then(rows=>{rows.forEach(({value:v})=>mp(v.col).set(v.id,v.data));Object.keys(listeners).forEach(emit)}));

  /* ---------- حالة المزامنة ---------- */
  let pending=0,syncing=false,lastErr='';
  async function refreshPill(){pending=await IDB.count('outbox').catch(()=>0);const on=navigator.onLine;
    pill.classList.add('show');pill.classList.toggle('off',!on||!session);pill.classList.toggle('pend',on&&!!session&&pending>0);
    pill.textContent=!on?`📴 أوفلاين${pending?' • '+pending+' مستني يترفع':''}`:!session?'🔑 سجّل دخول للمزامنة':syncing?'🔄 بيزامن…':pending?`⏳ ${pending} مستني يترفع`:'✓ محفوظ أونلاين'}
  pill.onclick=()=>{if(navigator.onLine&&!session)showLogin();else sync(false)};
  window.addEventListener('online',()=>{refreshPill();sync(false)});window.addEventListener('offline',refreshPill);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(false)});
  setInterval(()=>{if(pending)flush()},30000);

  const netErr=e=>!navigator.onLine||/fetch|network|load failed|timeout/i.test(e&&e.message||'');
  /* رفع التعديلات المحلية */
  let flushing=false;
  async function flush(){
    if(flushing||!client||!session||!navigator.onLine)return;flushing=true;lastErr='';
    try{
      const items=(await IDB.all('outbox')).map(x=>x.value).sort((a,b)=>a.ts-b.ts);
      for(let i=0;i<items.length;){
        const o=items[i];
        if(o.op==='set'){const batch=[];while(i<items.length&&items[i].op==='set'&&batch.length<200)batch.push(items[i++]);
          const {error}=await client.from(T).upsert(batch.map(b=>({col:b.col,id:b.id,data:b.data})),{onConflict:'col,id'});
          if(error){lastErr=error.message;break}
          for(const b of batch){const cur=await IDB.get('outbox',K(b.col,b.id));if(cur&&cur.ts===b.ts)await IDB.del('outbox',K(b.col,b.id))}
        }else{i++;const {error}=await client.from(T).delete().eq('col',o.col).eq('id',o.id);
          if(error){lastErr=error.message;break}
          const cur=await IDB.get('outbox',K(o.col,o.id));if(cur&&cur.ts===o.ts)await IDB.del('outbox',K(o.col,o.id))}
        await refreshPill();
      }
    }catch(e){lastErr=e.message;console.warn('flush',e)}finally{flushing=false;await refreshPill();if(pending&&!lastErr&&navigator.onLine&&session)setTimeout(flush,300)}
  }
  /* تنزيل التحديثات من قاعدة البيانات */
  async function pull(full){
    const since=full?null:await IDB.get('meta','lastSync');
    const outKeys=new Set((await IDB.all('outbox')).map(x=>x.key));
    const seen=new Set(),puts=[],touched=new Set();let maxU=since||null,from=0;const step=1000;
    const sinceQ=since?new Date(new Date(since).getTime()-120000).toISOString():null;
    for(;;){let q=client.from(T).select('col,id,data,updated_at').order('updated_at').order('col').order('id').range(from,from+step-1);
      if(sinceQ)q=q.gte('updated_at',sinceQ);
      const {data,error}=await q;if(error)throw error;
      data.forEach(r=>{const k=K(r.col,r.id);seen.add(k);if(!maxU||r.updated_at>maxU)maxU=r.updated_at;if(outKeys.has(k))return;
        mp(r.col).set(r.id,r.data);puts.push([k,{col:r.col,id:r.id,data:r.data}]);touched.add(r.col)});
      if(data.length<step)break;from+=step}
    const dels=[];
    if(full){(await IDB.all('docs')).forEach(({key,value:v})=>{if(!seen.has(key)&&!outKeys.has(key)){dels.push(key);mp(v.col).delete(v.id);touched.add(v.col)}})}
    await IDB.many('docs',puts,dels);
    if(maxU)await IDB.put('meta','lastSync',maxU);if(full)await IDB.put('meta','lastFull',Date.now());
    touched.forEach(emit);
  }
  async function sync(forceFull){
    if(syncing||!client||!session||!navigator.onLine){refreshPill();return}
    syncing=true;refreshPill();
    try{await flush();const lf=await IDB.get('meta','lastFull');await pull(forceFull||!lf||Date.now()-lf>864e5);ensureChannel()}
    catch(e){console.warn('sync',e);lastErr=e.message}finally{syncing=false;refreshPill()}
  }
  let channel=null;
  function ensureChannel(){if(channel||!client)return;
    channel=client.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:T},async p=>{
      const row=p.new&&p.new.col?p.new:p.old;if(!row||!row.col)return;const k=K(row.col,row.id);
      if(await IDB.get('outbox',k))return;
      if(p.eventType==='DELETE'){mp(row.col).delete(row.id);await IDB.del('docs',k)}else{mp(row.col).set(row.id,p.new.data);await IDB.put('docs',k,{col:row.col,id:row.id,data:p.new.data})}
      emit(row.col)}).subscribe()}

  /* ---------- واجهة قاعدة البيانات اللي الصفحة بتستخدمها ---------- */
  async function localWrite(col,id,op,data){
    const k=K(col,id);
    if(op==='set'){mp(col).set(id,data);await IDB.put('docs',k,{col,id,data})}else{mp(col).delete(id);await IDB.del('docs',k)}
    await IDB.put('outbox',k,{op,col,id,data:op==='set'?data:null,ts:Date.now()+Math.random()});
    emit(col);refreshPill();flush();
  }
  function docRef(col,id){return{id,path:col+'/'+id,
    async get(){await loadLocal();const d=mp(col).get(id);
      if(d===undefined&&client&&session&&navigator.onLine){const {data}=await client.from(T).select('data').eq('col',col).eq('id',id).maybeSingle();
        if(data){mp(col).set(id,data.data);return{id,exists:true,data:()=>data.data}}}
      return{id,exists:d!==undefined,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}},
    async set(body){await localWrite(col,id,'set',JSON.parse(JSON.stringify(body)))},
    async update(body){const s=await this.get();if(!s.exists){const x=new Error('missing');x.code='invalid_argument';throw x}return this.set({...s.data(),...body})},
    async delete(){await localWrite(col,id,'delete')},
    collection(sub){return colRef(col+'/'+id+'/'+sub)}}}
  function colRef(col){return{path:col,
    doc(id){return docRef(col,id||genId())},
    async add(body){const r=docRef(col,genId());await r.set(body);return r},
    onSnapshot(next){(listeners[col]=listeners[col]||[]).push(next);loadLocal().then(()=>emit(col));return()=>{listeners[col]=(listeners[col]||[]).filter(f=>f!==next)}},
    async get(){await loadLocal();const docs=[...mp(col).entries()].map(([id,data])=>({id,exists:true,data:()=>data}));return{docs,size:docs.length,empty:!docs.length}}}}
  const dbApi={collection:colRef,doc(path){const p=path.split('/');const id=p.pop();return docRef(p.join('/'),id)}};

  /* ---------- الحفظ على الجهاز (نسخة احتياطية / PDF) ---------- */
  const downloadsApi={async save({filename,data}){
    const type=/\.json$/i.test(filename)?'application/json':/\.html$/i.test(filename)?'text/html':/\.pdf$/i.test(filename)?'application/pdf':'application/octet-stream';
    const blob=data instanceof Blob?new Blob([data],{type}):new Blob([data],{type});const file=new File([blob],filename,{type});
    if(navigator.canShare&&/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});return{status:'saved'}}catch(e){if(e&&e.name==='AbortError'){const x=new Error('declined');x.code='declined';throw x}}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{status:'saved'}}};

  window.claude={use:async name=>{
    if(name==='db'){await ready;return dbApi}
    if(name==='user'){await ready;return{id:async()=>userEmail,can:async()=>true,canEdit:async()=>true,isOwner:async()=>true}}
    if(name==='downloads')return downloadsApi;
    return null}};
  window.sbUser=()=>userEmail;
  window.sbSignOut=async()=>{
    const n=await IDB.count('outbox').catch(()=>0);
    if(n&&typeof confirmBox==='function'&&!await confirmBox(`فيه ${n} تعديل لسه ما اترفعش أونلاين. لو خرجت دلوقتي هيفضلوا على الموبايل ويترفعوا لما تدخل تاني. تخرج؟`,'خروج'))return;
    manualOut=true;if(client)await client.auth.signOut();location.reload()};

  /* ---------- الشاشات ---------- */
  function showSetup(msg){gate.classList.add('show');
    box.innerHTML=`<h2>ربط قاعدة البيانات</h2><p>الصق رابط المشروع والمفتاح من Supabase ← Project Settings ← API. ده بيتعمل مرة واحدة بس.</p>
      <label>Project URL<input id="sbU" placeholder="https://xxxx.supabase.co"></label>
      <label>anon / publishable key<input id="sbK" placeholder="eyJ... أو sb_publishable_..."></label>
      <button id="sbSave">حفظ</button><div class="er">${msg||''}</div>`;
    box.querySelector('#sbSave').onclick=()=>{const u=box.querySelector('#sbU').value.trim(),k=box.querySelector('#sbK').value.trim();
      if(!/^https:\/\/.+/.test(u)||k.length<20){box.querySelector('.er').textContent='اتأكد من الرابط والمفتاح';return}
      LS.set('sb_url',u);LS.set('sb_key',k);location.reload()}}
  function showLogin(msg){gate.classList.add('show');
    box.innerHTML=`<h2>تسجيل الدخول</h2><p>ادخل بالإيميل والباسورد بتوعك.</p>
      <label>الإيميل<input id="sbE" type="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" value="${(LS.get('sb_user')||'').replace(/"/g,'')}"></label>
      <label>كلمة السر<span style="position:relative;display:block"><input id="sbP" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" style="padding-left:52px">
        <button type="button" id="sbEye" style="position:absolute;left:6px;top:50%;transform:translateY(-38%);width:auto;margin:0;padding:6px 10px;background:#eef2f0;color:#16211e;font-size:15px">👁</button></span></label>
      <button id="sbIn">دخول</button><div class="er">${msg||''}</div>
      ${isReady?'<button class="lnk" id="sbLater">بعدين — كمّل على البيانات اللي على الموبايل</button>':''}
      ${SB_URL?'':'<button class="lnk" id="sbReset">تغيير بيانات الربط</button>'}`;
    const btn=box.querySelector('#sbIn'),er=box.querySelector('.er');
    const go=async()=>{if(!navigator.onLine){er.textContent='محتاج نت عشان تسجّل دخول';return}btn.disabled=true;er.textContent='';
      const {error}=await client.auth.signInWithPassword({email:box.querySelector('#sbE').value.trim().toLowerCase(),password:box.querySelector('#sbP').value});
      btn.disabled=false;if(error)er.textContent=/Invalid login/i.test(error.message)?'الإيميل أو كلمة السر غلط':'مقدرتش أدخل: '+error.message};
    btn.onclick=go;box.querySelector('#sbP').onkeydown=e=>{if(e.key==='Enter')go()};
    box.querySelector('#sbEye').onclick=()=>{const p=box.querySelector('#sbP');p.type=p.type==='password'?'text':'password'};
    const lt=box.querySelector('#sbLater');if(lt)lt.onclick=()=>gate.classList.remove('show');
    const rs=box.querySelector('#sbReset');if(rs)rs.onclick=()=>{LS.del('sb_url');LS.del('sb_key');location.reload()}}

  async function openApp(){if(isReady)return;isReady=true;gate.classList.remove('show');await loadLocal();readyResolve();refreshPill();if(deferred)ib.style.display='block'}

  /* ---------- التشغيل ---------- */
  if(!cfg.u||!cfg.k){showSetup();return}
  const lastUser=LS.get('sb_user');
  if(!window.supabase||!window.supabase.createClient){
    if(lastUser){userEmail=lastUser;openApp();return}   // أوفلاين ومكتبة المزامنة مش متحمّلة: نفتح على بيانات الموبايل
    gate.classList.add('show');box.innerHTML='<h2>محتاج نت أول مرة</h2><p>أول مرة التطبيق محتاج نت عشان يتحمّل. اتأكد من الإنترنت وافتحه تاني.</p>';return}
  client=window.supabase.createClient(cfg.u,cfg.k,{auth:{persistSession:true,autoRefreshToken:true}});
  let checking=false;
  async function onSession(s){
    session=s||null;
    if(!session){
      if(lastUser&&!navigator.onLine){userEmail=lastUser;openApp();return}
      if(lastUser&&isReady){refreshPill();return}
      if(lastUser){userEmail=lastUser;openApp();showLogin('الجلسة خلصت — ادخل تاني عشان المزامنة تكمّل. بياناتك على الموبايل سليمة.');return}
      showLogin();return}
    const email=session.user&&session.user.email;
    if(!isReady&&!checking&&LS.get('sb_member')!==email){checking=true;
      const {data:mem,error}=await client.from('members').select('email').eq('email',email).maybeSingle();checking=false;
      if(!error&&!mem){session=null;await client.auth.signOut();showLogin('الإيميل ده مش مضاف كعضو في قاعدة البيانات.');return}
      if(!error)LS.set('sb_member',email)}
    if(lastUser&&lastUser!==email){await IDB.clear('docs');await IDB.clear('outbox');await IDB.clear('meta');localLoaded=null;Object.keys(cache).forEach(k=>cache[k].clear());Object.keys(listeners).forEach(emit);await IDB.put('meta','lastFull',0)}
    userEmail=email;LS.set('sb_user',email);gate.classList.remove('show');
    await openApp();sync(false);
  }
  client.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_OUT'){if(manualOut)return;session=null;refreshPill();return}
    if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')setTimeout(()=>onSession(s),0)});
})();
</script>

<script>
/* ============ أدوات عامة ============ */
const I={
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
  truck:'<svg viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
  pie:'<svg viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  tag:'<svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  dots:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  badge:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 18c.8-2.2 2.5-3.3 4.5-3.3s3.7 1.1 4.5 3.3M10 3v2h4V3"/></svg>',
  cart:'<svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10.5l2-8H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;
  const s=String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g,'.').replace(/[,٬\s]/g,'');const n=parseFloat(s);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const fmt=n=>r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const money=n=>`<span class="num">${fmt(n)}</span>`;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fdate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const el=h=>{const t=document.createElement('div');t.innerHTML=h.trim();return t.children.length===1?t.firstElementChild:t};
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0);
const byDateAsc=(a,b)=>-byDateDesc(a,b);
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ar');

const COLS=['partners','customers','suppliers','txns','purchases','statements','dedItems','contribs','sales','projects','transfers','employees','empTx','items','mfg','stockAdj','settings'];
const S={};COLS.forEach(c=>S[c]=[]);
const loaded={};
let db=null,view='home',cashFilter='all',stFilter='all',q={};
let wFrom='',wTo='',wProfit='',salesTab='st',invFilter='all';
const KIND={general:'عام',customer:'عميل',supplier:'مورد',partner:'شريك'};
const KCOL={customer:'customers',supplier:'suppliers',partner:'partners'};
const VIEWS=[['home','الرئيسية','home'],['cash','الصندوق','cash'],['statements','المبيعات','doc'],
  ['customers','العملاء','users'],['suppliers','الموردين','truck'],['employees','الموظفين','badge'],['partners','الشركاء','pie'],['reports','التقارير','chart'],['stock','المخزن','box']];

function find(col,id){return S[col].find(x=>x.id===id)}
function nameOf(col,id){const x=find(col,id);return x?x.name:'(محذوف)'}

/* ============ الحسابات ============ */
function cashBal(){return sum(S.txns,t=>t.dir==='in'?num(t.amount):-num(t.amount))}
function partyTx(kind,id){return S.txns.filter(t=>t.kind===kind&&t.refId===id)}
function custBal(id){const c=find('customers',id);
  return num(c&&c.opening)+sum(S.sales.filter(s=>s.customerId===id),s=>num(s.amount))
    -sum(S.statements.filter(s=>s.customerId===id),stSettled)
    -sum(S.transfers.filter(t=>t.fromId===id),t=>num(t.amount))+sum(S.transfers.filter(t=>t.toId===id),t=>num(t.amount))
    -sum(partyTx('customer',id).filter(t=>t.link!=='statements'),t=>t.dir==='in'?num(t.amount):-num(t.amount))}
/* المستخلص بيتخصم كله (الإجمالي) من المستحق على العميل — سعر التعاقد شامل الاستقطاعات. اللي بيدخل الصندوق = الصافي */
const stSettled=s=>num(s.gross);
const stPending=s=>s.offCash?0:r2(num(s.net)-num(s.collected));
function supBal(id){const c=find('suppliers',id);
  return num(c&&c.opening)+sum(S.purchases.filter(p=>p.supplierId===id),p=>num(p.amount))
    -sum(partyTx('supplier',id),t=>t.dir==='out'?num(t.amount):-num(t.amount))}
/* حركات رأس مال الشريك: من الصندوق (إيداع/سحب) + مساهمات مباشرة من جيبه (زي تكلفة التجهيز) مقسومة بالتساوي */
function partnerEvents(id){
  const ev=partyTx('partner',id).map(t=>({date:t.date,amount:t.dir==='in'?num(t.amount):-num(t.amount),t:t.note||(t.dir==='in'?'إيداع':'مسحوبات'),ca:t.createdAt,act:'editTxn',aid:t.id}));
  S.contribs.forEach(c=>{const ids=c.partnerIds||[];if(ids.includes(id))ev.push({date:c.date,amount:r2(num(c.amount)/ids.length),
    t:`${c.note||'مساهمة مباشرة'} (نصيبه 1/${ids.length})`,ca:c.createdAt,act:'editContrib',aid:c.id})});
  return ev.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ca||0)-(b.ca||0));
}
function partnerPaid(id){return sum(partnerEvents(id),e=>e.amount)}
const dayN=s=>Math.floor(Date.parse(s+'T00:00:00Z')/864e5);
/* رأس المال × الأيام في الفترة [from,to] (الأيام شاملة البداية والنهاية) */
function partnerWeight(id,from,to){
  const F=dayN(from),T=dayN(to);if(!(T>=F))return 0;let w=0;
  partnerEvents(id).forEach(e=>{if(!e.date)return;const d=dayN(e.date);if(d>T)return;w+=e.amount*(T-Math.max(d,F)+1)});
  return w;
}

function allLines(){

function reportData(){

  rows.sort((a,b)=>b.date.localeCompare(a.date));

}
function makeGroups(rows){

  const g={};rows.forEach(r=>{const k=keyOf(r);const o=g[k]||(g[k]={label:rep.group==='item'?r.name:rep.group==='month'?(r.date?r.date.slice(5,7)+'/'+r.date.slice(0,4):'—'):k,unit:r.unit,units:new Set(),qty:0,total:0,docs:new Set()});
    o.qty+=r.qty;o.total+=r.total;o.units.add(r.unit||'');o.docs.add(r.kind+r.id)});
  let groups=Object.entries(g).map(([k,o])=>({k,...o,mixed:o.units.size>1}));
  groups.sort(rep.group==='month'?(a,b)=>b.k.localeCompare(a.k):(a,b)=>b.total-a.total);

}
function finData(){

  const inP=pid=>!rep.proj||(rep.proj==='__none'?!pid:pid===rep.proj);

  const invs=(sale?S.sales:S.purchases).filter(d=>inP(d.projectId)&&inD(d.date)&&(!rep.party||d[pf]===rep.party));
  const sts=sale?S.statements.filter(d=>inP(d.projectId)&&inD(d.date)&&(!rep.party||d.customerId===rep.party)):[];
  const party=rep.party&&find(sale?'customers':'suppliers',rep.party);
  const opening=party&&!rep.proj&&!rep.from?num(party.opening):0;

  invs.forEach(d=>{if(num(d[paidF]))pays.push({date:d.date,t:`مع فاتورة ${d.number||''}`,who:nameOf(sale?'customers':'suppliers',d[pf]),v:num(d[paidF])})});
  sts.forEach(d=>pays.push({date:d.date,t:`مستخلص ${d.number||''} (استقطاعات ${fmt(num(d.dedTotal))}، صافي ${fmt(num(d.net))})`,who:nameOf('customers',d.customerId),v:num(d.gross),st:1}));

  let trIn=0;const trList=[];
  if(sale&&rep.party)S.transfers.filter(t=>(t.fromId===rep.party||t.toId===rep.party)&&inP(t.projectId)&&inD(t.date)).forEach(t=>{
    if(t.fromId===rep.party)pays.push({date:t.date,t:`شهادة أعمال ${t.number||''} منقولة إلى ${nameOf('customers',t.toId)}`,who:'',v:num(t.amount)});else{trIn+=num(t.amount);trList.push(t)}});
  pays.sort((a,b)=>(a.date||'').localeCompare(b.date||''));

    sub:sum(invs,d=>num(d.subtotal!=null?d.subtotal:d.amount)),disc:sum(invs,d=>num(d.discAmt)),vat:sum(invs,d=>num(d.vatAmt)),wht:sum(invs,d=>num(d.whtAmt)),invNet:sum(invs,d=>num(d.amount)),
    stGross:sum(sts,d=>num(d.gross)),stDed:sum(sts,d=>num(d.dedTotal)),stNet:sum(sts,d=>num(d.net)),pays};
  f.due=f.opening+f.invNet+f.trIn;f.stPaid=sum(pays.filter(p=>p.st),p=>p.v);f.other=sum(pays.filter(p=>!p.st),p=>p.v);f.paid=f.stPaid+f.other;f.rem=f.due-f.paid;

  return f;
}

function projStats(id){

/* ============ الشيت (النوافذ) ============ */
const stack=[];
function pushSheet(b){stack.push(b);showTop()}
function popSheet(){stack.pop();stack.length?showTop():hideSheet()}
function closeAll(){stack.length=0;hideSheet()}
function hideSheet(){document.body.classList.remove('sheet-open')}
function showTop(keep){
  const b=stack[stack.length-1];const r=b();b.live=!!r.live;
  const body=$('#shBody'),st=keep?body.scrollTop:0;
  $('#shTitle').textContent=r.title;
  body.replaceChildren(r.body);
  const f=$('#shFoot');f.replaceChildren(...(r.foot||[]));f.hidden=!r.foot;
  $('#shBack').style.visibility=stack.length>1?'visible':'hidden';
  document.body.classList.add('sheet-open');body.scrollTop=st;
  if(!keep&&r.focus){setTimeout(()=>{const i=body.querySelector(r.focus);i&&i.focus()},280)}
}
$('#shBack').innerHTML=I.back;$('#shX').innerHTML=I.x;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function confirmBox(msg,ok='حذف'){return new Promise(res=>{$('#dlgMsg').textContent=msg;$('#dlgOk').textContent=ok;$('#dlg').classList.add('show');
  const done=v=>{$('#dlg').classList.remove('show');$('#dlgOk').onclick=$('#dlgNo').onclick=null;res(v)};
  $('#dlgOk').onclick=()=>done(true);$('#dlgNo').onclick=()=>done(false)})}
function banner(m){const b=$('#banner');b.textContent=m||'';b.classList.toggle('show',!!m)}

async function run(fn){
  if(!db){toast('البيانات مش متصلة — لازم تفتح الصفحة وانت مسجّل دخول');return false}
  for(let i=0;i<2;i++){
    try{await fn();return true}catch(e){
      const c=e&&e.code;console.error(e);
      if(c==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,500+Math.random()*700));continue}
      toast(c==='quota_exceeded'?'مساحة البيانات امتلأت. احذف حركات قديمة أو كلّمني نوسّعها.':
            c==='invalid_argument'?'مش مسموح لك تعدّل البيانات (صلاحية عرض بس).':'حصلت مشكلة في الحفظ، جرّب تاني.');
      return false}
  }
}
const col=c=>db.collection(c);

function footBtns(onSave,onDel,saveLbl='حفظ'){
  const s=el(`<button class="btn">${saveLbl}</button>`);
  s.onclick=async()=>{s.disabled=true;try{await onSave()}finally{s.disabled=false}};
  const arr=[s];
  if(onDel){const d=el(`<button class="btn danger">حذف</button>`);d.onclick=onDel;arr.push(d)}
  return arr;
}
const val=(b,n)=>{const x=b.querySelector(`[name="${n}"]`);return x?x.value.trim():''};
const opts=(list,sel,ph)=>`<option value="">${ph||'— اختار —'}</option>`+[...list].sort(byName).map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
function segBind(b,name,init,onChange){
  const w=b.querySelector(`[data-seg="${name}"]`);let v=init;
  const set=x=>{v=x;w.querySelectorAll('button').forEach(k=>k.classList.toggle('on',k.dataset.v===x));onChange&&onChange(x)};
  w.addEventListener('click',e=>{const k=e.target.closest('button');if(k)set(k.dataset.v)});set(init);return()=>v;
}

      <div class="err"></div></div>`);
    const kindSel=b.querySelector('[name=kind]'),refSel=b.querySelector('[name=refId]');
    let dirV;
    const hintFor=()=>{const k=kindSel.value,d=dirV&&dirV();
      return k==='customer'?(d==='in'?'تحصيل من العميل — بيقلّل المستحق عليه.':'رد فلوس للعميل — بيزوّد المستحق عليه.')
        :k==='supplier'?(d==='out'?'دفعة للمورد — بتقلّل المستحق له.':'فلوس راجعة من المورد.')
        :k==='partner'?(d==='in'?'إيداع من الشريك في رأس المال.':'مسحوبات للشريك.'):''};
    const syncKind=()=>{const k=kindSel.value,c=KCOL[k];
      b.querySelector('.refw').style.display=c?'':'none';b.querySelector('.projw').style.display=(k==='customer'||k==='supplier')?'':'none';b.querySelector('.catw').style.display=c?'none':'';

    dirV=segBind(b,'dir',v.dir,()=>syncKind());

      if(amount<=0){err.textContent='اكتب مبلغ صحيح';return}

      const projectId=(kind==='customer'||kind==='supplier')?await resolveProject(b,err):'';if(projectId===false)return;
      const data={dir:dirV(),amount,date:val(b,'date')||today(),kind,refId,projectId,category:KCOL[kind]?'':val(b,'category'),note:val(b,'note'),

      if(g<=0){err.textContent='اكتب إجمالي المستخلص';return}
      if(dl.some(z=>z.amount<=0)){err.textContent='فيه استقطاع من غير مبلغ';return}
      if(d>g){err.textContent='الاستقطاعات أكبر من إجمالي المستخلص';return}
      if(c<0||c>n+0.004){err.textContent='المبلغ المحصّل لازم يكون بين صفر والصافي';return}
      const projectId=await resolveProject(b,err);if(projectId===false)return;
      const ref=x?col('statements').doc(x.id):col('statements').doc(),id=ref.id;
      const number=val(b,'number'),date=val(b,'date')||today();
      const data={customerId:cid,number,date,projectId,project:val(b,'project'),gross:g,deductions:dl.map(z=>z.itemId?{itemId:z.itemId,name:z.name,amount:z.amount}:{name:z.name||'أخرى',amount:z.amount}),dedTotal:d,net:n,collected:c,offCash:off,
        createdAt:x?.createdAt||Date.now(),updatedAt:Date.now()};
      const ok=await run(async()=>{
        await ref.set(data);
        const tref=col('txns').doc('st_'+id);
        if(c>0)await tref.set({dir:'in',amount:c,date,kind:'customer',refId:cid,category:'',note:`تحصيل مستخلص${number?' رقم '+number:''}${projectId?' — '+nameOf('projects',projectId):data.project?' — '+data.project:''}`,link:'statements',linkId:id,createdAt:data.createdAt,updatedAt:Date.now()});
        else await tref.delete();
      });
      if(ok){toast('اتحفظ المستخلص');popSheet()}
    };
    const del=x?async()=>{if(await confirmBox('تحذف المستخلص؟ المبلغ اللي دخل الصندوق منه هيتشال كمان.')&&await run(async()=>{await col('statements').doc(x.id).delete();await col('txns').doc('st_'+x.id).delete()})){toast('اتحذف');popSheet()}}:null;
    return {title:x?'تعديل مستخلص':'مستخلص جديد',body:b,foot:footBtns(save,del),focus:x?null:(v.customerId?'[name=gross]':null)};
  };
}

const INV={
  sale:{col:'sales',pcol:'customers',pf:'customerId',pre:'sa_',paid:'collected',dir:'in',kind:'customer',t:'فاتورة بيع',party:'العميل',
    paidLbl:'المحصّل نقداً في الصندوق',fillLbl:'اتحصّلت كلها',remLbl:'الباقي على العميل (آجل)',noteP:'مبيعات',noParty:'عميل',
    delMsg:'تحذف فاتورة البيع؟ المبلغ اللي اتحصّل منها هيتشال من الصندوق.'},
  purchase:{col:'purchases',pcol:'suppliers',pf:'supplierId',pre:'pu_',paid:'paid',dir:'out',kind:'supplier',t:'فاتورة شراء',party:'المورد',
    paidLbl:'المدفوع نقداً من الصندوق',fillLbl:'اتدفعت كلها',remLbl:'الباقي للمورد (آجل)',noteP:'مشتريات',noParty:'مورد',
    delMsg:'تحذف فاتورة الشراء؟ المبلغ اللي اتدفع منها هيرجع للصندوق.'}
};
function invTotals(lines,adj){
  const sub=r2(sum(lines,l=>num(l.qty)*num(l.price)));
  const a=(o,base)=>!o||!num(o.v)?0:r2(o.pct?base*num(o.v)/100:num(o.v));
  const disc=a(adj.disc,sub),base=r2(sub-disc),vat=a(adj.vat,base),wht=a(adj.wht,base);
  return {sub,disc,base,vat,wht,total:r2(base+vat-wht)};
}
function invForm(type,x,pre={}){

    if(!S[C.pcol].length){

    const adjRow=(k,lbl,o)=>`<div class="adj" data-k="${k}"><span>${lbl}</span><input inputmode="decimal" placeholder="0" value="${esc(o&&num(o.v)?o.v:'')}">
      <div class="seg mini"><button type="button" data-p="1" class="${!o||o.pct!==false?'on':''}">%</button><button type="button" data-p="0" class="${o&&o.pct===false?'on':''}">ج</button></div><b class="num aa">0</b></div>`;
    const b=el(`<div class="form">

      ${projSelect(v.projectId)}
      <div class="two"><label>رقم الفاتورة<input name="number" value="${esc(v.number||'')}"></label>

      <div class="box">
        <div class="sum"><span>الإجمالي قبل الخصم</span><b class="num ssub">0</b></div>
        ${adjRow('disc','(−) خصم',v.disc)}
        <div class="sum"><span>بعد الخصم</span><b class="num sbase">0</b></div>

        ${adjRow('wht','(−) ض. خصم وإضافة',v.wht)}
        <div class="sum tot"><span>صافي الفاتورة</span><b class="num stot">0</b></div></div>
      <label>ملاحظات<input name="note" value="${esc(v.lines&&v.lines.length?(v.note||''):'')}" placeholder="اختياري"></label>

        <button type="button" class="btn sm ghost fill">${C.fillLbl}</button></div>

    const addLine=l=>{const r=el(`<div class="ln"><div class="lnh"><input class="lnn" data-sug="stockItems" placeholder="الصنف / البيان" value="${esc(l.name)}"><input class="lnu" data-sug="units" placeholder="الوحدة" value="${esc(l.unit||'')}"></div>
        <div class="lnr"><input class="lnq" inputmode="none" data-calc data-expr="${esc(l.expr||'')}" placeholder="الكمية" value="${esc(l.qty)}"><span>×</span><input class="lnp" inputmode="decimal" placeholder="السعر" value="${esc(l.price)}">
        <b class="num lnt">0</b><button type="button" class="x">${I.x}</button></div><div class="lninfo" style="font-size:11.5px;color:var(--muted);margin-top:5px"></div></div>`);
      r.querySelector('.x').onclick=()=>{r.remove();calc()};lw.appendChild(r)};
    lw.addEventListener('change',e=>{if(!e.target.classList.contains('lnn'))return;const r=e.target.closest('.ln'),it=itemByName(e.target.value),u=r.querySelector('.lnu');
      if(it&&!u.value.trim()){u.value=type==='purchase'&&it.buyUnit?it.buyUnit:(it.unit||'')}calc()});
    lines.forEach(addLine);
    b.querySelector('.addln').onclick=()=>{addLine({name:'',qty:1,price:''});lw.lastChild.querySelector('.lnn').focus();calc()};
    b.querySelectorAll('.adj .seg').forEach(s=>s.addEventListener('click',e=>{const k=e.target.closest('button');if(!k)return;
      s.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===k));calc()}));
    const read=()=>{
      const ls=[...lw.querySelectorAll('.ln')].map(r=>({name:r.querySelector('.lnn').value.trim(),unit:r.querySelector('.lnu').value.trim(),expr:r.querySelector('.lnq').dataset.expr||'',qty:num(r.querySelector('.lnq').value),price:num(r.querySelector('.lnp').value),el:r}));
      const adj={};b.querySelectorAll('.adj').forEach(r=>adj[r.dataset.k]={v:num(r.querySelector('input').value),pct:r.querySelector('.seg .on').dataset.p==='1'});
      return {ls,adj}};
    const calc=()=>{const {ls,adj}=read();
      ls.forEach(l=>{l.el.querySelector('.lnt').textContent=fmt(l.qty*l.price);const it=itemByName(l.name),inf=l.el.querySelector('.lninfo');
        if(!inf)return;if(!it){inf.textContent=l.name?'مش صنف مخزني (مش هيأثر على المخزن)':'';return}
        const f=lineFactor(it,l);inf.innerHTML=`📦 ${KINDN[it.kind]||'خامة'} — الرصيد ${fmtQ(stockQty(it.id))} ${esc(it.unit||'')}${f!==1&&l.qty?` • هيتحسب ${fmtQ(l.qty*f)} ${esc(it.unit||'')}`:''}`});
      const T=invTotals(ls,adj),p=r2(num(val(b,'paid')));
      b.querySelector('.ssub').textContent=fmt(T.sub);b.querySelector('.sbase').textContent=fmt(T.base);b.querySelector('.stot').textContent=fmt(T.total);
      b.querySelectorAll('.adj').forEach(r=>r.querySelector('.aa').textContent=fmt(T[r.dataset.k]));
      b.querySelector('.rem').textContent=T.total?(p<T.total?`${C.remLbl}: ${fmt(T.total-p)}`:p>T.total+0.004?'المدفوع أكبر من صافي الفاتورة!':'الفاتورة اتسددت بالكامل.'):'';
      return {ls,adj,T,p}};
    b.addEventListener('input',calc);calc();
    b.querySelector('.fill').onclick=()=>{b.querySelector('[name=paid]').value=calc().T.total;calc()};
    const err=b.querySelector('.err');
    const save=async()=>{
      const {ls,adj,T,p}=calc(),pid=val(b,'party');
      const good=ls.filter(l=>l.name||l.qty*l.price);
      if(!pid){err.textContent=`اختار ${C.party}`;return}
      if(!good.length||T.sub<=0){err.textContent='ضيف بند واحد على الأقل بكمية وسعر';return}
      if(good.some(l=>!(l.qty*l.price))){err.textContent='فيه بند من غير كمية أو سعر';return}
      if(T.total<=0){err.textContent='صافي الفاتورة لازم يكون أكبر من صفر';return}
      if(p<0||p>T.total+0.004){err.textContent='المدفوع لازم يكون بين صفر وصافي الفاتورة';return}
      const projectId=await resolveProject(b,err);if(projectId===false)return;
      const ref=x?col(C.col).doc(x.id):col(C.col).doc(),id=ref.id,number=val(b,'number'),date=val(b,'date')||today();
      const userNote=val(b,'note');
      const summary=good.map(l=>l.name).filter(Boolean).slice(0,3).join('، ')+(good.length>3?` و${good.length-3} أخرى`:'');
      const data={[C.pf]:pid,number,date,projectId,lines:good.map(l=>{const it=itemByName(l.name);return {name:l.name,unit:l.unit,qty:l.qty,price:l.price,...(it?{itemId:it.id}:{}),...(l.expr?{expr:l.expr}:{})}}),
        disc:adj.disc,vat:adj.vat,wht:adj.wht,subtotal:T.sub,discAmt:T.disc,vatAmt:T.vat,whtAmt:T.wht,amount:T.total,[C.paid]:p,
        note:userNote||summary,createdAt:x?.createdAt||Date.now(),updatedAt:Date.now()};
      const ok=await run(async()=>{
        await ref.set(data);
        const tref=col('txns').doc(C.pre+id);
        if(p>0)await tref.set({dir:C.dir,amount:p,date,kind:C.kind,refId:pid,category:'',note:`${C.noteP}${number?' فاتورة '+number:''}${data.note?' — '+data.note:''}`,link:C.col,linkId:id,createdAt:data.createdAt,updatedAt:Date.now()});
        else await tref.delete();

      if(ok){toast('اتحفظت الفاتورة');popSheet()}

    const del=x?async()=>{if(await confirmBox(C.delMsg)&&await run(async()=>{await col(C.col).doc(x.id).delete();await col('txns').doc(C.pre+x.id).delete()})){toast('اتحذفت');popSheet()}}:null;
    return {title:x?`تعديل ${C.t}`:`${C.t} جديدة`,body:b,foot:footBtns(save,del),focus:x?null:(v[C.pf]?'.lnn':null)};
  };
}

let printing=false;
async function makePdf(title,bodyHTML,filters){
  if(printing)return;printing=true;
  try{
    const dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(!dl){toast('الطباعة مش متاحة هنا — افتح الصفحة من تطبيق Claude أو claude.ai');return}
    toast('بيجهّز ملف PDF…');
    const now=new Date();
    const inner=`<div class="ph"><div><div class="co">حسابات الشركة</div><h1>${esc(title)}</h1></div><div class="dt">تاريخ الطباعة<br>${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div>
      ${filters?`<div class="flt">${esc(filters)}</div>`:''}${bodyHTML}<div class="ft">حسابات الشركة • ${esc(title)}</div>`;
    const base=(title.replace(/[\\/:*?"<>|]/g,' ').trim()||'تقرير')+' '+now.toISOString().slice(0,10);
    let libs=true;
    try{await Promise.all([loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}catch(e){libs=false}
    if(!libs||!window.html2canvas||!window.jspdf){
      // بديل: ملف HTML بيفتح ويطبع
      const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
        <style>${PRINT_CSS.replace(/#printRoot\{position:fixed;left:-10000px;top:0;width:794px;/,'#printRoot{max-width:794px;margin:0 auto;')}@page{size:A4;margin:12mm}@media print{#printRoot{padding:0}}</style></head>
        <body><div id="printRoot">${inner}</div><script>setTimeout(()=>print(),400)<\/script></body></html>`;
      try{await dl.save({filename:base+'.html',data:html});toast('اتحفظ الملف — افتحه في المتصفح وهيطلب الطباعة')}
      catch(e){if(!(e&&e.code==='declined'))toast('مقدرتش أحفظ الملف')}
      return;
    }
    try{await document.fonts.ready}catch(e){}
    const root=document.createElement('div');root.id='printRoot';root.innerHTML=inner;
    document.body.appendChild(root);
    // نقط القطع المناسبة بين الصفحات (نهاية صف أو عنصر)
    const top0=root.getBoundingClientRect().top;
    const brk=[...root.querySelectorAll('tr,.ph,.flt,.card,.box,.grid2,h2,h4,.sum,.ft,p')].map(e=>e.getBoundingClientRect().bottom-top0).sort((a,b)=>a-b);
    const canvas=await html2canvas(root,{scale:2,backgroundColor:'#fff',useCORS:true,windowWidth:794});
    const H=root.scrollHeight;root.remove();
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',orientation:'portrait'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pageH=794*ph/pw,sc=canvas.width/794;
    let y=0,first=true,pageNo=0;const pages=[];
    while(y<H-1){let end=Math.min(y+pageH,H);
      if(end<H){const c=brk.filter(b=>b>y+pageH*0.5&&b<=y+pageH);if(c.length)end=c[c.length-1]}
      pages.push([y,end]);y=end}
    for(const [a,b] of pages){
      const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.ceil((b-a)*sc);
      c.getContext('2d').drawImage(canvas,0,Math.floor(a*sc),canvas.width,c.height,0,0,canvas.width,c.height);
      if(!first)pdf.addPage();first=false;pageNo++;
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,(b-a)*pw/794);
      pdf.setFontSize(9);pdf.setTextColor(150);pdf.text(`${pageNo} / ${pages.length}`,pw/2,ph-14,{align:'center'});
    }
    const fname=base+'.pdf';
    try{await dl.save({filename:fname,data:pdf.output('blob')});toast('اتحفظ الملف — افتحه واطبعه')}
    catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'فيه طلب حفظ مفتوح بالفعل':'مقدرتش أحفظ الملف')}
  }catch(e){console.error(e);toast('حصلت مشكلة في تجهيز الملف')}
  finally{printing=false;const r=document.getElementById('printRoot');r&&r.remove()}
}

function doRestore(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let file;try{file=JSON.parse(await f.text())}catch(e){toast('الملف ده مش نسخة احتياطية سليمة');return}
    if(!file||file.app!=='company-accounts'||!file.data){toast('الملف ده مش نسخة احتياطية من الصفحة دي');return}
    const items=[];COLS.forEach(c=>(file.data[c]||[]).forEach(d=>{if(d&&d.id)items.push([c,d])}));
    const exist=items.filter(([c,d])=>S[c].some(x=>x.id===d.id)).length;
    if(!items.length){toast('النسخة فاضية');return}
    const when=file.exportedAt?new Date(file.exportedAt).toLocaleDateString('en-GB'):'';
    if(!await confirmBox(`استرجاع ${items.length} سجل من نسخة ${when}؟ ${exist?`فيه ${exist} سجل موجود بالفعل وهيرجع زي ما كان في النسخة. `:''}السجلات اللي اتعملت بعد النسخة مش هتتمسح.`,'استرجاع'))return;
    let done=0,fail=0;const t0=Date.now();
    const work=async([c,d])=>{const {id,...body}=d;for(let k=0;k<4;k++){try{await db.collection(c).doc(id).set(body);done++;return}catch(e){
      if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')){await new Promise(r=>setTimeout(r,800*(k+1)));continue}break}}fail++};
    const q=[...items];const workers=Array.from({length:4},async()=>{while(q.length){await work(q.shift());if((done+fail)%25===0)toast(`بيسترجع… ${done+fail} من ${items.length}`)}});
    await Promise.all(workers);
    toast(fail?`اترجع ${done} سجل، و${fail} معرفتش أرجّعهم — جرّب تاني`:`اترجعت كل البيانات (${done} سجل)`);
  };
  inp.click();
}

const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ymOf=d=>(d||today()).slice(0,7);
const ymAdd=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${String(m).padStart(2,'0')}`};
const ymName=ym=>{if(!ym)return '';const [y,m]=ym.split('-');return `${AR_MONTHS[+m-1]} ${y}`};
let payMonth=ymOf(today());
const ET={advance:'سلفة',bonus:'مكافأة',grant:'منحة',deduction:'خصم / جزاء',salary:'صرف مرتب'};
const ETCAT={advance:'سلف موظفين',bonus:'مكافآت ومنح',grant:'مكافآت ومنح',salary:'مرتبات وأجور'};
const instOf=t=>Math.max(1,Math.round(num(t.installments)||1));
function advShare(t,ym){const n=instOf(t),s=t.month||ymOf(t.date);for(let i=0;i<n;i++)if(ymAdd(s,i)===ym)return num(t.amount)/n;return 0}
function payroll(e,ym){
  const tx=S.empTx.filter(t=>t.empId===e.id),inM=t=>(t.month||ymOf(t.date))===ym;
  const adv=r2(sum(tx.filter(t=>t.type==='advance'),t=>advShare(t,ym)));
  const bon=r2(sum(tx.filter(t=>t.type==='bonus'&&!t.paidNow&&inM(t)),t=>num(t.amount)));
  const gr=r2(sum(tx.filter(t=>t.type==='grant'&&!t.paidNow&&inM(t)),t=>num(t.amount)));
  const now=r2(sum(tx.filter(t=>(t.type==='bonus'||t.type==='grant')&&t.paidNow&&inM(t)),t=>num(t.amount)));
  const ded=r2(sum(tx.filter(t=>t.type==='deduction'&&inM(t)),t=>num(t.amount)));
  const base=num(e.salary),net=r2(base+bon+gr-adv-ded);
  const pays=tx.filter(t=>t.type==='salary'&&inM(t)),paid=r2(sum(pays,t=>num(t.amount)));
  return {base,adv,bon,gr,now,ded,net,paid,rem:r2(net-paid),pays};
}
function advLeft(e,ym){return r2(sum(S.empTx.filter(t=>t.empId===e.id&&t.type==='advance'),t=>{const n=instOf(t),s=t.month||ymOf(t.date);let l=0;for(let i=0;i<n;i++)if(ymAdd(s,i)>ym)l+=num(t.amount)/n;return l}))}

/* ============ المخزن والتصنيع ============ */
let stockTab='items',stockKind='all';
const fmtQ=n=>(Math.round(n*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3});
const KINDN={raw:'خامة',product:'منتج'};
const itemByName=n=>{const k=norm(n);return k?S.items.find(i=>norm(i.name)===k)||null:null};
const lineItem=l=>(l.itemId&&find('items',l.itemId))||itemByName(l.name);
const lineFactor=(it,l)=>it&&it.buyUnit&&num(it.buyFactor)>0&&l.unit&&norm(l.unit)===norm(it.buyUnit)?num(it.buyFactor):1;
const _sm=new Map();
const stockStart=()=>{const s=S.settings.find(x=>x.id==='stock');return s&&s.startDate||''};
const afterStart=d=>{const st=stockStart();return !st||(d||'')>=st};
function stockMoves(id){
  if(_sm.has('m'+id))return _sm.get('m'+id);
  const it=find('items',id),ev=[];if(!it)return ev;
  if(num(it.openingQty))ev.push({date:stockStart(),ca:0,t:'رصيد أول المدة (الجرد)',in:num(it.openingQty),out:0,cost:num(it.openingCost)||null});
  S.purchases.forEach(d=>(d.lines||[]).forEach(l=>{const li=lineItem(l);if(li&&li.id===id){const f=lineFactor(li,l);
    ev.push({date:d.date,ca:d.createdAt,t:`فاتورة شراء ${d.number||''} — ${nameOf('suppliers',d.supplierId)}`,in:num(l.qty)*f,out:0,cost:num(l.price)/f,act:'editPu',id:d.id})}}));
  S.sales.forEach(d=>(d.lines||[]).forEach(l=>{const li=lineItem(l);if(li&&li.id===id){const f=lineFactor(li,l);
    ev.push({date:d.date,ca:d.createdAt,t:`فاتورة بيع ${d.number||''} — ${nameOf('customers',d.customerId)}`,in:0,out:num(l.qty)*f,cost:null,rev:num(l.qty)*num(l.price),sale:1,act:'editSale',id:d.id})}}));
  S.mfg.forEach(m=>{
    if(m.productId===id)ev.push({date:m.date,ca:m.createdAt,t:`تصنيع ${m.number||''}`,in:num(m.qty),out:0,cost:'mfg',m,act:'editMfg',id:m.id});
    (m.inputs||[]).forEach(x=>{if(x.itemId===id)ev.push({date:m.date,ca:m.createdAt,t:`صرف لتصنيع ${m.number||''} — ${nameOf('items',m.productId)}`,in:0,out:num(x.qty),cost:null,act:'editMfg',id:m.id})})});
  S.stockAdj.forEach(a=>{if(a.itemId===id){const q=num(a.qty);ev.push({date:a.date,ca:a.createdAt,t:`تسوية — ${a.reason||'جرد'}${a.note?' ('+a.note+')':''}`,in:q>0?q:0,out:q<0?-q:0,cost:q>0&&num(a.unitCost)?num(a.unitCost):null,act:'editAdj',id:a.id})}});
  const ev2=ev.filter(e=>e.t.startsWith('رصيد أول')||afterStart(e.date));
  ev2.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ca||0)-(b.ca||0));
  _sm.set('m'+id,ev2);return ev2;
}
const stockQty=id=>{const k='q'+id;if(!_sm.has(k))_sm.set(k,r2x(sum(stockMoves(id),e=>e.in-e.out)));return _sm.get(k)};
const r2x=n=>Math.round(n*1000)/1000;
function avgCost(id,depth=0){
  const k='c'+id;if(_sm.has(k))return _sm.get(k);if(depth>4)return 0;
  let q=0,v=0;stockMoves(id).forEach(e=>{if(!e.in)return;const c=e.cost==='mfg'?mfgUnitCost(e.m,depth+1):e.cost;if(c==null)return;q+=e.in;v+=e.in*c});
  const r=q?v/q:0;_sm.set(k,r);return r;
}
function mfgCost(m,depth=0){const mat=sum(m.inputs||[],x=>num(x.qty)*avgCost(x.itemId,depth));return {mat,extra:num(m.extra),total:mat+num(m.extra)}}
const mfgUnitCost=(m,depth=0)=>num(m.qty)?mfgCost(m,depth).total/num(m.qty):0;
function itemProfit(id){const ev=stockMoves(id).filter(e=>e.sale),qty=sum(ev,e=>e.out),rev=sum(ev,e=>e.rev),cost=qty*avgCost(id);
  return {qty,rev,cost,profit:rev-cost,margin:rev?(rev-cost)/rev*100:0,count:ev.length}}
function profitHTML(pr){
  const rows=S.items.map(it=>({it,p:itemProfit(it.id)})).filter(x=>x.p.count).sort((a,b)=>b.p.profit-a.p.profit);
  if(!rows.length)return '<div class="empty">لسه مفيش مبيعات لأصناف مخزنية بعد تاريخ بداية المخزن.</div>';
  const m=pr?fmt:money,t=k=>sum(rows,x=>x.p[k]),tr=t('rev');
  return `<div style="overflow-x:auto"><table class="led"><thead><tr><th>الصنف</th><th>المباع</th><th>المبيعات</th><th>التكلفة</th><th>الربح</th><th>الهامش</th></tr></thead><tbody>
    ${rows.map(({it,p})=>`<tr ${pr?'':`class="click" data-act="openItem" data-id="${esc(it.id)}"`}><td>${esc(it.name)}</td><td class="n">${fmtQ(p.qty)} ${esc(it.unit||'')}</td><td class="n">${m(p.rev)}</td><td class="n">${m(p.cost)}</td><td class="n"><b class="${p.profit<0?'neg':'pos'}">${m(p.profit)}</b></td><td class="n">${fmt(p.margin)}%</td></tr>`).join('')}
    <tr style="font-weight:800;background:#e8efec"><td>الإجمالي</td><td></td><td class="n">${m(tr)}</td><td class="n">${m(t('cost'))}</td><td class="n">${m(t('profit'))}</td><td class="n">${fmt(tr?t('profit')/tr*100:0)}%</td></tr></tbody></table></div>
  <div class="hint" style="margin-top:8px">المبيعات بسعر البيع قبل الخصم والضرايب. التكلفة = الكمية المباعة × متوسط تكلفة الوحدة (للمنتج المصنّع: خامات + مصاريف الأمر).</div>`;
}
const lowStock=it=>num(it.minQty)>0&&stockQty(it.id)<=num(it.minQty);
function itemRow(it){const q=stockQty(it.id),c=avgCost(it.id);
  return `<button class="row" data-act="openItem" data-id="${esc(it.id)}"><div class="dot ic ${it.kind==='product'?'in':'pri'}">${I.box}</div>
    <div class="m"><div class="ttl">${esc(it.name)}</div><div class="s">${KINDN[it.kind]||'خامة'}${c?' • تكلفة الوحدة '+fmt(c):''}</div>
    ${q<0?'<div style="margin-top:3px"><span class="tag" style="background:var(--out-l);color:var(--out)">رصيد بالسالب</span></div>':lowStock(it)?'<div style="margin-top:3px"><span class="tag warn">قرب يخلص</span></div>':''}</div>
    <div class="a ${q<0?'neg':''}"><span class="num">${fmtQ(q)}</span><small>${esc(it.unit||'')}</small></div></button>`}
function stockView(){
  const tabs=`<div class="seg">${[['items','الأصناف ('+S.items.length+')'],['mfg','التصنيع ('+S.mfg.length+')']].map(([k,l])=>`<button data-act="sttab" data-v="${k}" class="${stockTab===k?'on':''}">${l}</button>`).join('')}</div>`;
  if(stockTab==='mfg'){
    const list=[...S.mfg].sort(byDateDesc);
    return tabs+`<div class="list">${list.length?list.map(m=>{const it=find('items',m.productId),u=mfgUnitCost(m);
      return `<button class="row" data-act="editMfg" data-id="${esc(m.id)}"><div class="dot ic in">${I.box}</div>
      <div class="m"><div class="ttl">${esc(it?it.name:'(محذوف)')}</div><div class="s">أمر ${esc(m.number||'')} • ${esc(fdate(m.date))} • ${(m.inputs||[]).length} خامة${m.projectId?' • '+esc(nameOf('projects',m.projectId)):''}</div></div>
      <div class="a"><span class="num">${fmtQ(num(m.qty))}</span> <small>${esc(it?it.unit||'':'')}${u?' • '+fmt(u)+' للوحدة':''}</small></div></button>`}).join('')
      :`<div class="empty">${S.items.some(i=>i.kind==='product')?'لسه مفيش أوامر تصنيع. دوس + عشان تصنّع.':'عرّف المنتجات والخامات الأول من تبويب الأصناف.'}</div>`}</div>`;
  }
  const s=(q.stock||'').trim();
  let list=[...S.items].sort(byName);if(stockKind!=='all')list=list.filter(i=>(i.kind||'raw')===stockKind);if(s)list=list.filter(i=>norm(i.name).includes(norm(s)));
  const val=sum(S.items,i=>Math.max(0,stockQty(i.id))*avgCost(i.id)),low=S.items.filter(lowStock).length;
  const st=stockStart();
  const startCard=st?`<div class="hint" style="margin:0 2px 10px;display:flex;justify-content:space-between;align-items:center">بداية المخزن: <b>${fdate(st)}</b> — الفواتير اللي قبله مش بتأثر على المخزن<button class="lnk" style="border:0;background:none;color:var(--pri);font-weight:700" data-act="stockStart">تعديل</button></div>`
    :`<div class="card" style="border:1px solid var(--warn);background:var(--warn-l)"><b>حدد تاريخ بداية المخزن</b><div class="hint" style="margin:4px 0 10px">ده اليوم اللي هتعمل فيه الجرد. الفواتير اللي قبله مش هتأثر على المخزن، والجرد هو رصيد أول المدة.</div><button class="btn sm" data-act="stockStart">تحديد التاريخ</button></div>`;
  return tabs+startCard+`<div class="card hero"><div class="lbl">قيمة المخزون (بمتوسط التكلفة)</div><div class="big">${money(val)}</div>
    <div class="sub"><span>خامات ${S.items.filter(i=>i.kind!=='product').length}</span><span>منتجات ${S.items.filter(i=>i.kind==='product').length}</span>${low?`<span>⚠ ${low} صنف قرب يخلص</span>`:''}</div></div>
  <div class="acts"><button class="btn ghost" data-act="addAdj">⚖ تسوية / جرد</button><button class="btn ghost" data-act="addMfg">🏭 أمر تصنيع</button><button class="btn ghost" data-act="profitRep">📈 الربحية</button></div>
  <div class="seg">${[['all','الكل'],['raw','الخامات'],['product','المنتجات']].map(([k,l])=>`<button data-act="skind" data-v="${k}" class="${stockKind===k?'on':''}">${l}</button>`).join('')}</div>
  <input class="search" id="srch" data-q="stock" placeholder="بحث باسم الصنف…" value="${esc(q.stock||'')}">
  <div class="list">${list.length?list.map(itemRow).join(''):`<div class="empty">${S.items.length?'مفيش نتائج.':'عرّف الأصناف (الخامات والمنتجات) من زرار +.<br>الفواتير هتحرّك المخزون لما اسم الصنف فيها يكون نفس اسم الصنف هنا.'}</div>`}</div>`;
}
function itemDetail(id){
  return ()=>{
    const it=find('items',id);if(!it)return{title:'محذوف',body:el('<div class="empty">الصنف اتحذف.</div>'),live:true};
    const q=stockQty(id),c=avgCost(id);let bal=0;
    const rows=stockMoves(id).map(e=>{bal+=e.in-e.out;return `<tr ${e.act?`class="click" data-act="${e.act}" data-id="${esc(e.id)}"`:''}><td>${esc(fdate(e.date))}</td><td>${esc(e.t)}</td><td class="n">${e.in?fmtQ(e.in):''}</td><td class="n">${e.out?fmtQ(e.out):''}</td><td class="n"><b class="${bal<0?'neg':''}">${fmtQ(bal)}</b></td></tr>`}).join('');
    const body=el(`<div>
      <div class="card hero"><div class="lbl">${KINDN[it.kind]||'خامة'} • الرصيد الحالي</div><div class="big"><span class="num">${fmtQ(q)}</span> <span style="font-size:18px">${esc(it.unit||'')}</span></div>
        <div class="sub"><span>تكلفة الوحدة ${fmt(c)}</span><span>القيمة ${fmt(Math.max(0,q)*c)}</span>${it.buyUnit?`<span>الـ${esc(it.buyUnit)} = ${fmtQ(num(it.buyFactor))} ${esc(it.unit||'')}</span>`:''}${num(it.minQty)?`<span>الحد الأدنى ${fmtQ(num(it.minQty))}</span>`:''}</div></div>
      ${q<0?'<div class="hint" style="color:var(--out)">الرصيد بالسالب: اتصرف أكتر من اللي اتسجّل دخوله. راجع فواتير الشراء أو اعمل تسوية.</div>':''}
      ${(()=>{const p=itemProfit(id);return p.count?`<div class="box"><h4>المبيعات والربح</h4>
        <div class="sum"><span>الكمية المباعة</span><b>${fmtQ(p.qty)} ${esc(it.unit||'')}</b></div><div class="sum"><span>إجمالي المبيعات</span><b>${money(p.rev)}</b></div>
        <div class="sum"><span>(−) التكلفة</span><b>${money(p.cost)}</b></div><div class="sum tot"><span>الربح</span><b class="${p.profit<0?'neg':'pos'}">${money(p.profit)}</b></div>
        <div class="sum"><span>هامش الربح</span><b>${fmt(p.margin)}%</b></div><div class="sum"><span>متوسط سعر البيع للوحدة</span><b>${money(p.qty?p.rev/p.qty:0)}</b></div></div>`:''})()}
      <div class="acts">${it.kind==='product'?`<button class="btn" data-act="addMfg" data-p="${esc(id)}">🏭 تصنيع</button>`:''}<button class="btn ghost" data-act="addAdj" data-i="${esc(id)}">⚖ تسوية / جرد</button><button class="btn ghost" data-act="editItem" data-id="${esc(id)}">تعديل</button></div>
      <h4 style="margin:6px 2px 8px">حركة الصنف</h4>
      ${rows?`<div style="overflow-x:auto"><table class="led"><thead><tr><th>التاريخ</th><th>البيان</th><th>وارد</th><th>صادر</th><th>الرصيد</th></tr></thead><tbody>${rows}</tbody></table></div><div class="hint" style="margin-top:8px">دوس على أي سطر يفتح الفاتورة أو أمر التصنيع بتاعه.</div>`:'<div class="empty">مفيش حركة لسه.</div>'}
      ${it.notes?`<div class="hint" style="margin-top:10px">${esc(it.notes)}</div>`:''}</div>`);
    return {title:it.name,body,live:true};
  };
}
function itemForm(x,pre={}){

    const v=x?{...x}:{name:pre.name||'',kind:pre.kind||'raw',unit:'',buyUnit:'',buyFactor:'',openingQty:'',openingCost:'',minQty:'',notes:''};

        <label class="fw">فيها كام وحدة مخزن<input name="buyFactor" inputmode="none" data-calc value="${esc(v.buyFactor||'')}" placeholder="مثلاً: 2.88"></label></div>
        <div class="hint convh" style="margin:0"></div></div>
      <div class="two"><label>رصيد أول المدة<input name="openingQty" inputmode="none" data-calc value="${esc(v.openingQty||'')}" placeholder="0"></label>
        <label>تكلفة الوحدة<input name="openingCost" inputmode="decimal" value="${esc(v.openingCost||'')}" placeholder="0"></label></div>
      <label>الحد الأدنى (تنبيه لما يقرب يخلص)<input name="minQty" inputmode="decimal" value="${esc(v.minQty||'')}" placeholder="اختياري"></label>
      <label>ملاحظات<input name="notes" value="${esc(v.notes||'')}"></label><div class="err"></div></div>`);
    let kindV;kindV=segBind(b,'kind',v.kind||'raw');
    const conv=()=>{const u=val(b,'unit')||'وحدة',bu=val(b,'buyUnit'),f=num(val(b,'buyFactor'));
      b.querySelector('.convh').textContent=bu?(f?`لما تشتري 10 ${bu}، المخزن هيزيد ${fmtQ(10*f)} ${u}.`:`اكتب الـ${bu} فيها كام ${u}.`):'لو بتشتري وتصرف بنفس الوحدة، سيبها فاضية.';
      b.querySelector('.fw').firstChild.textContent=`الـ${bu||'وحدة'} فيها كام ${u}`};
    b.addEventListener('input',conv);b.addEventListener('change',conv);conv();
    const err=b.querySelector('.err');
    const save=async()=>{const name=val(b,'name');if(!name){err.textContent='اكتب اسم الصنف';return}
      if(S.items.some(i=>norm(i.name)===norm(name)&&(!x||i.id!==x.id))){err.textContent='فيه صنف بنفس الاسم';return}
      if(!val(b,'unit')){err.textContent='اكتب وحدة المخزن';return}
      if(val(b,'buyUnit')&&!(num(val(b,'buyFactor'))>0)){err.textContent='اكتب وحدة الشراء فيها كام وحدة مخزن';return}
      const ref=x?col('items').doc(x.id):col('items').doc();
      if(await run(()=>ref.set({name,kind:kindV(),unit:val(b,'unit'),buyUnit:val(b,'buyUnit'),buyFactor:num(val(b,'buyFactor')),openingQty:num(val(b,'openingQty')),openingCost:num(val(b,'openingCost')),
        minQty:num(val(b,'minQty')),notes:val(b,'notes'),createdAt:x?.createdAt||Date.now(),updatedAt:Date.now()}))){toast('اتحفظ الصنف');popSheet()}};
    const del=x?async()=>{const used=stockMoves(x.id).filter(e=>e.act).length;if(used){toast(`مينفعش تحذفه — عليه ${used} حركة`);return}
      if(await confirmBox(`تحذف صنف "${x.name}"؟`)&&await run(()=>col('items').doc(x.id).delete())){toast('اتحذف');closeAll()}}:null;
    return {title:x?'تعديل صنف':'صنف جديد',body:b,foot:footBtns(save,del),focus:x?null:'[name=name]'};
  };
}

/* ===== قايمة اقتراحات بديلة للـ datalist (بتشتغل على كل الموبايلات) ===== */
(()=>{
  const nz=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim().toLowerCase();
  const box=document.createElement('div');box.id='sug';document.body.appendChild(box);
  let cur=null;
  const opts=inp=>{const dl=document.getElementById(inp.dataset.sug);return dl?[...dl.querySelectorAll('option')].map(o=>o.value):[]};
  const hide=()=>{box.style.display='none';cur=null};
  const place=inp=>{const r=inp.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,w=Math.min(Math.max(r.width,180),vw-16);
    let left=Math.min(Math.max(8,r.right-w),vw-w-8);box.style.width=w+'px';box.style.left=left+'px';
    const below=vh-r.bottom-8,above=r.top-8,up=below<160&&above>below;
    box.style.maxHeight=Math.max(120,Math.min(260,(up?above:below)-4))+'px';
    if(up){box.style.top='';box.style.bottom=(vh-r.top+4)+'px'}else{box.style.bottom='';box.style.top=(r.bottom+4)+'px'}};
  const show=inp=>{const all=opts(inp),q=nz(inp.value);
    const list=q?all.filter(o=>nz(o).includes(q)&&o!==inp.value):all;
    if(!list.length){hide();return}
    cur=inp;box.innerHTML=list.slice(0,40).map(o=>`<button type="button">${o.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</button>`).join('');
    box.querySelectorAll('button').forEach((b,i)=>b.dataset.i=i);box._list=list.slice(0,40);
    box.style.display='block';place(inp)};
  document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.sug)show(t);else if(!box.contains(t))hide()});
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.sug)show(t)});
  document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.dataset||!a.dataset.sug)hide()},120));
  document.addEventListener('scroll',()=>{if(cur){if(document.body.contains(cur))place(cur);else hide()}},true);
  box.addEventListener('pointerdown',e=>e.preventDefault());
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!cur)return;const inp=cur;inp.value=box._list[+b.dataset.i];
    hide();inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));
    const nx=inp.closest('.ln,.ded,.form')&&[...inp.closest('.ln,.ded,.form').querySelectorAll('input')];const i=nx?nx.indexOf(inp):-1;
    const nxt=nx&&nx.slice(i+1).find(x=>!x.value&&x.type!=='date');if(nxt)nxt.focus();else{inp.blur();hide()}});
})();

  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const ov=document.createElement('div');ov.id='calcOv';
  const p=document.createElement('div');p.id='calc';
  p.innerHTML=`<div class="ttl"><span>احسب الكمية</span><button class="x" type="button" data-k="close">×</button></div>
    <div class="disp"><div class="ex"></div><div class="rs"></div></div>
    <div class="keys">${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','.','0','⌫','='].map(k=>
      `<button type="button" data-k="${k}" class="${'÷×−+='.includes(k)?'op':k==='C'||k==='⌫'?'fn':''}">${k}</button>`).join('')}</div>
    <button class="ok" type="button" data-k="ok">تم</button>`;
  document.body.append(ov,p);
  const exEl=p.querySelector('.ex'),rsEl=p.querySelector('.rs');
  let target=null,ex='';
  // محلّل آمن للعمليات الحسابية
  function evaluate(s){
    s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫|,/g,'.').replace(/\s/g,'');
    let i=0;const peek=()=>s[i];
    const num=()=>{const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
    const fac=()=>{if(peek()==='-'){i++;return -fac()}if(peek()==='+'){i++;return fac()}
      if(peek()==='('){i++;const v=expr();if(peek()===')')i++;return v}return num()};
    const term=()=>{let v=fac();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v};
    const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v};
    if(!s)return null;const v=expr();if(i<s.length)throw 0;return isFinite(v)?v:null;
  }
  const fmtN=v=>String(Math.round(v*10000)/10000);
  const upd=()=>{exEl.textContent=ex||'0';let r=null;try{r=evaluate(ex)}catch(e){}
    rsEl.textContent=r!=null&&/[+\-−×÷*/()]/.test(ex.replace(/^-/,''))?'= '+fmtN(r):'';return r};
  const open=inp=>{target=inp;ex=inp.dataset.expr||inp.value||'';upd();ov.classList.add('open');p.classList.add('open')};
  const close=()=>{ov.classList.remove('open');p.classList.remove('open');target=null};
  const done=()=>{if(!target)return close();let r=null;try{r=evaluate(ex)}catch(e){}
    if(ex&&r==null){rsEl.textContent='العملية مش مكتملة';return}
    const t=target;t.value=r==null?'':fmtN(r);
    if(/[+\-−×÷*/()]/.test(ex.replace(/^-/,'')))t.dataset.expr=ex;else delete t.dataset.expr;
    t.title=t.dataset.expr||'';close();t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}))};
  p.addEventListener('pointerdown',e=>e.preventDefault());
  p.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
    if(k==='close')return close();if(k==='ok')return done();
    if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);
    else if(k==='='){let r=null;try{r=evaluate(ex)}catch(e){}if(r!=null)ex=fmtN(r);else rsEl.textContent='العملية مش مكتملة'}
    else{const ops='÷×−+';if(ops.includes(k)&&ops.includes(ex.slice(-1)))ex=ex.slice(0,-1);ex+=k}
    if(k!=='=')upd();else exEl.textContent=ex||'0'});
  ov.addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(!target)return;const m={'*':'×','/':'÷','-':'−','Enter':'ok','Backspace':'⌫','Escape':'close'};
    const k=m[e.key]||e.key;const b=p.querySelector(`[data-k="${k}"]`);if(b){e.preventDefault();b.click()}});
  document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&'calc' in t.dataset){t.blur();open(t)}});
  window.openCalc=open;
})();
</script>
</body>
</html>
